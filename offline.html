<!DOCTYPE html>
<html lang="tl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#00C853">
  <title>Kandong – Offline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0A0A0A;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
      padding: 2rem;
    }
    .box {
      max-width: 320px;
    }
    .icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 1.25rem;
      border-radius: 20px;
      background: #00C853;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 900;
      color: #0A0A0A;
    }
    h1 { color: #00C853; font-size: 1.5rem; margin-bottom: 0.5rem; }
    p { color: rgba(255,255,255,0.55); font-size: 0.9rem; line-height: 1.5; margin-bottom: 1.5rem; }
    button {
      background: #00C853;
      color: #0A0A0A;
      border: none;
      font-weight: 800;
      font-size: 14px;
      padding: 12px 28px;
      border-radius: 9999px;
      cursor: pointer;
    }
    button:active { transform: scale(0.97); }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">K</div>
    <h1>Kandong</h1>
    <p>Walang internet connection. Subukan ulit kapag may signal.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
